name: CompilerX Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    name: Backend CI & Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Static Code Analysis & Linting (CO3 - SecOps)
        run: |
          ruff check backend/app
          mypy backend/app --ignore-missing-imports

      - name: Run Backend Unit & Integration Tests (CO1, CO2)
        working-directory: backend
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=70

  sandbox-image-build:
    name: Sandbox Container Image Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Sandbox Docker Image
        run: |
          docker build -t compilerx-sandbox:latest ./sandbox
